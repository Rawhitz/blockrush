<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SnakeRush</title></head><body style="margin:0;background:#061128;color:white;font-family:Arial;text-align:center"><p style="margin-top:40vh">Loading SnakeRush…</p><script>
fetch('../snakerush/index.html?v=timeattack-color-balance2').then(r=>r.text()).then(html=>{
  html=html.replace(/<p>Race from 1 to 100\.<\/p><div class="modegrid"><button class="btn solo" onclick="startSingle\(\)">[\s\S]*?<\/button><button class="btn multi" onclick="showMulti\(\)">[\s\S]*?<\/button><\/div>/,'<p>Race from 1 to 100.</p><p style="margin:8px 0 10px;font-weight:900">CHOOSE YOUR COLOUR</p><div class="modegrid"><button class="btn" style="background:linear-gradient(135deg,#ff6b6b,#c81e36)" onclick="startColor(\'#ef4046\',\'#2f79dc\')">🔴 RED</button><button class="btn" style="background:linear-gradient(135deg,#64b4ff,#275fd1)" onclick="startColor(\'#2f79dc\',\'#ef4046\')">🔵 BLUE</button><button class="btn" style="background:linear-gradient(135deg,#ffe86b,#d99b00);color:#241900" onclick="startColor(\'#edb400\',\'#2caf58\')">🟡 YELLOW</button><button class="btn" style="background:linear-gradient(135deg,#5be67b,#178942)" onclick="startColor(\'#2caf58\',\'#edb400\')">🟢 GREEN</button></div><p style="font-size:11px;opacity:.7;margin:9px 0 0">The bot takes the opposite colour.</p>');
  html=html.replace(/<div id="multi" class="hidden">[\s\S]*?<\/div><div class="rules">/,'<div class="rules">');
  html=html.replace('.top{display:grid;grid-template-columns:1fr 1fr 1fr;', '.top{display:grid;grid-template-columns:repeat(4,1fr);');
  html=html.replace(/function showMulti\(\)[\s\S]*?function hideMulti\(\)[\s\S]*?\}/,'');
  html=html.replace("const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];", "let HUMAN_COLOR='#edb400',BOT_COLOR='#2caf58';const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];");
  html=html.replace("drawToken('human','#ffb400',-9);drawToken('bot','#38d26a',9)", "drawToken('human',HUMAN_COLOR,-9);drawToken('bot',BOT_COLOR,9)");
  html=html.replace('await animateMove(who,pos[who],pos[who]+r);pos[who]+=r;', 'await animateMove(who,pos[who],pos[who]+r);');
  html=html.replace(/function forcedEntryRoll\(who\)\{[\s\S]*?return Math\.random\(\)<p\?1:null\}/,`function forcedEntryRoll(who){if(pos[who]>0)return null;entryTry[who]++;if(entryTry[who]>=5)return 1;let p;if(who==='human'){p=entryTry[who]===4?.82:entryTry[who]===3?.58:entryTry[who]===2?.34:.22}else{p=entryTry[who]===4?.52:entryTry[who]===3?.30:.14}return Math.random()<p?1:null}`);
  html=html.replace(/function adaptiveRoll\(who\)\{[\s\S]*?return r\}/,`function adaptiveRoll(who){const forced=forcedEntryRoll(who);if(forced)return forced;let r=1+Math.floor(Math.random()*6);if(pos[who]>0){const legal=[1,2,3,4,5,6].filter(v=>pos[who]+v<=100);if(legal.length){legal.sort((a,b)=>scoreMove(who,b)-scoreMove(who,a));if(who==='human'){let help=.34;if(pos.human+10<pos.bot)help=.52;if(losses>=1)help=Math.max(help,.58);if(Math.random()<help)r=legal[0]}else{let botHelp=.09;if(pos.bot+18<pos.human)botHelp=.16;if(Math.random()<botHelp)r=legal[0];else if(pos.bot>pos.human+12&&Math.random()<.20){const safer=legal.slice().sort((a,b)=>scoreMove(who,a)-scoreMove(who,b));r=safer[0]}}}}return r}`);
  html=html.replace('<div class="pill">DICE<strong id="diceText" class="dice dicebox">⚀</strong></div></div><div class="boardwrap">','<div class="pill">DICE<strong id="diceText" class="dice dicebox">⚀</strong></div><div class="pill">TIME<strong id="timeAttack">00:00</strong></div></div><div class="boardwrap">');
  html=html.replace('<p id="winText"></p><button class="btn solo" onclick="startSingle()">PLAY AGAIN</button>','<p id="winText"></p><div id="timeResult" style="font-size:12px;color:#ffe15a;margin:8px 0"></div><button class="btn solo" onclick="startSingle()">PLAY AGAIN</button>');
  html=html.replace('</body>',`<script>
(function(){
 const SCORE_API='https://blockrush-backend.vercel.app/api/score';
 const launch=new URLSearchParams(location.search).get('launch')||'';
 let startedAt=0,timerId=null,elapsedMs=0;
 function fmt(ms){const total=Math.floor(ms/1000),m=Math.floor(total/60),s=total%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
 function paint(){const e=document.getElementById('timeAttack');if(e)e.textContent=fmt(startedAt?performance.now()-startedAt:elapsedMs)}
 function startClock(){clearInterval(timerId);elapsedMs=0;startedAt=performance.now();paint();timerId=setInterval(paint,250)}
 function stopClock(){if(startedAt)elapsedMs=performance.now()-startedAt;startedAt=0;clearInterval(timerId);timerId=null;paint();return elapsedMs}
 async function submit(ms){const box=document.getElementById('timeResult');if(!launch){if(box)box.textContent='⏱ '+fmt(ms)+' • Open from Telegram to enter Time Attack rankings.';return}const timeScore=Math.max(1,1000000-Math.floor(ms/100));if(box)box.textContent='⏱ '+fmt(ms)+' • Saving Time Attack score…';try{const r=await fetch(SCORE_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({launch,score:timeScore})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Score sync failed');if(box)box.textContent='🏆 '+fmt(ms)+' • Time Score '+timeScore.toLocaleString()+' • Telegram ranking updated';}catch(e){if(box)box.textContent='⏱ '+fmt(ms)+' • Telegram ranking sync failed this time.'}}
 const oldStart=window.startSingle;window.startSingle=function(){const r=oldStart();startClock();return r};
 window.startColor=function(humanColor,botColor){HUMAN_COLOR=humanColor;BOT_COLOR=botColor;return window.startSingle()};
 const oldFinish=window.finish;window.finish=function(who){const ms=stopClock();const won=who==='human';const r=oldFinish(who);const txt=document.getElementById('winText');if(txt)txt.innerHTML+=(txt.innerHTML?'<br>':'')+'⏱ Finish time: '+fmt(ms);const box=document.getElementById('timeResult');if(won)submit(ms);else if(box)box.textContent='Only winning finishes enter the Time Attack leaderboard.';return r};
 const oldBack=window.backMenu;window.backMenu=function(){stopClock();return oldBack()};
})();
<\/script></body>`);
  document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<h2>SnakeRush failed to load</h2><p>Please reopen the game.</p>'});
</script></body></html>
