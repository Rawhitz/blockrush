(function(){
  /* -------- Stable Bengali Ludo rule layer -------- */
  const pairMeta={};

  function removePair(id){
    if(id==null)return;
    for(const col of Object.keys(pawns||{})) for(const p of pawns[col]||[]) if(p.pair===id)p.pair=null;
    delete pairMeta[id];
  }
  function destination(col,i,roll){const p=pawns[col][i];return p.p===-1?0:p.p+roll}
  function joinBuddy(col,i,dest){
    if(dest<0||dest>=52)return -1;
    const a=(OFF[col]+dest)%52;
    return pawns[col].findIndex((q,j)=>j!==i&&q.pair===null&&q.p>=0&&q.p<52&&absPos(col,q.p)===a);
  }
  function canSplitHere(col,id){
    const m=pairMembers(col,id); if(m.length!==2)return false;
    const meta=pairMeta[id];
    if(!meta||!meta.starLocked)return true;
    return onStar(col,pawns[col][m[0]].p);
  }

  /* Same-square pawns do NOT automatically become Jora. */
  formJora=function(){};

  makeActions=function(col,roll){
    const out=[];
    for(let i=0;i<4;i++){
      if(!legalSingle(col,i,roll))continue;
      const d=destination(col,i,roll),buddy=joinBuddy(col,i,d);
      out.push({type:'single',i,label:buddy>=0?('Pawn '+(i+1)+' • KEEP SEPARATE'):('Pawn '+(i+1))});

    for(const id of ids){
      const m=pairMembers(col,id);
      if(m.length!==2)continue;
      if(legalPair(col,id,roll))out.push({type:'pair',id,label:'Jora '+m.map(x=>x+1).join('+')+' • '+(roll/2)+' step',jora:true});
      if(canSplitHere(col,id)){
        for(const i of m) if(legalSingleAfterSplit(col,i,roll)) out.push({type:'split',id,i,label:'✂️ Split → Pawn '+(i+1),split:true});
      }

    return out;
  };

  capture=function(col,moved,isPair){

    if(cap)toast('💥 Captured pawn returned to base!');

  };

  applyAction=function(col,a,roll){

      const members=pairMembers(col,a.id);

      delete pairMeta[a.id];
      toast('✂️ Jora split');
      a={type:'single',i:a.i};
    }
    if(a.type==='single'||a.type==='singleJoin'){
      const p=pawns[col][a.i];
      if(p.p===-1){p.p=0;attempts[col]=0}else p.p+=roll;
      moved=[a.i];
      if(a.type==='singleJoin'){
        const buddy=pawns[col][a.buddy];
        if(p.p>=0&&p.p<52&&buddy&&buddy.pair===null&&absPos(col,buddy.p)===absPos(col,p.p)){
          const id=pairSeq++; p.pair=id; buddy.pair=id;
          pairMeta[id]={starLocked:onStar(col,p.p)};
          toast(pairMeta[id].starLocked?'⭐ Star Jora formed — split only on a star':'🤝 Jora formed — may split anywhere');
          moved=[a.i,a.buddy]; isPair=true;
        }
      }
    }else if(a.type==='pair'){
      const m=pairMembers(col,a.id),steps=roll/2;
      for(const i of m)pawns[col][i].p+=steps;
      moved=m;isPair=true;
    }
    const cap=capture(col,moved,isPair);
    draw();
    /* 58 is HOME. Finished pawns are never legal to move again. */
    if(pawns[col].every(p=>p.p===58)){endGame(col);return}
    setTimeout(()=>finish(roll===6||cap),420);
  };

  scoreAction=function(col,a,roll){
    let idx=a.i;
    if(idx==null&&a.id!=null)idx=pairMembers(col,a.id)[0];
    const p=pawns[col][idx],steps=a.type==='pair'?roll/2:roll,t=p.p===-1?0:p.p+steps;
    let s=t;
    if(t===58)s+=1500; else if(t>=52)s+=450;
    if(p.p===-1)s+=180;
    if(a.type==='singleJoin')s+=120;
    if(a.type==='pair')s+=80;

  };

  /* -------- Time Attack + clear dice -------- */
  const SCORE_API='https://blockrush-backend.vercel.app/api/score';

  function paint(){const e=document.getElementById('timeAttack');if(e)e.textContent=fmt(startedAt?performance.now()-startedAt:elapsedMs)}
  function startClock(){clearInterval(timerId);elapsedMs=0;startedAt=performance.now();paint();timerId=setInterval(paint,250)}

  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  showDice=function(){const e=document.getElementById('diceText');if(!e)return;if(typeof dice==='number'&&dice>=1&&dice<=6){e.textContent=dice+' '+faces[dice-1];e.style.color='#ffd84a';e.style.textShadow='0 0 18px #ffd84aaa';}else{e.textContent='—';e.style.color='#fff';e.style.textShadow='none'}};
  const oldStart=startSingle; startSingle=function(c){Object.keys(pairMeta).forEach(k=>delete pairMeta[k]);const r=oldStart(c);showDice();startClock();return r};
  const oldEnd=endGame; endGame=function(col){const ms=stopClock();const won=col===human;const r=oldEnd(col);const sub=document.getElementById('winnerSub');if(sub)sub.innerHTML+=(sub.innerHTML?'<br>':'')+'⏱ Finish time: '+fmt(ms);const box=document.getElementById('timeResult');if(won)submit(ms);else if(box)box.textContent='Only winning finishes enter the Time Attack leaderboard.';return r};
  const oldRestart=restartToMenu; restartToMenu=function(){stopClock();return oldRestart()};
})();
<\/script></body>`);
