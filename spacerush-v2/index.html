<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>SPACE RUSH v2</title><style>html,body{margin:0;background:#050313;min-height:100%;overflow:hidden}iframe{width:100%;height:100vh;border:0;display:block;background:#050313}</style></head><body><iframe id="game" title="Space Rush"></iframe><script>
const f=document.getElementById('game');f.src='../spacerush/'+location.search;
f.addEventListener('load',()=>{
  try{
    const w=f.contentWindow;
    w.eval(`
      // SpaceRush v2 hotfix: visible boss entry + earned-score-only Endless mode.
      spawnBoss=function(){
        boss={x:W+100,y:H*.5,r:48,hp:35+wave*9,max:35+wave*9,t:0,shoot:.55,entering:true};
        flash('⚠️ BOSS INCOMING',1300);beep(120,.5,'sawtooth',.06,80);
      };
      const _oldUpdate=update;
      update=function(dt){
        const beforeScore=score;
        const beforeBoss=boss;
        _oldUpdate(dt);
        // Remove the old passive survival points (8 + wave*2 per second).
        score=Math.max(0,score-dt*(8+wave*2));
        // Bosses must actually enter the battlefield instead of remaining at W+100.
        if(boss){
          const targetX=W*.78;
          if(boss.x>targetX){
            boss.x=Math.max(targetX,boss.x-190*dt);
          }
        }
        updateHUD();
      };
      status.textContent='Destroy enemies to score • Endless waves never stop';
    `);
  }catch(e){console.error('SpaceRush v2 patch failed',e)}
});
</script></body></html>
