<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>CricketRush 3D v5</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#142948,#02050d 72%);color:#fff}body{padding:8px 8px 26px}.hidden{display:none!important}.wrap{width:min(97vw,760px);margin:auto}.brand{text-align:center;font-weight:1000;font-size:30px;background:linear-gradient(90deg,#fff1a8,#ffc928,#ff7a00);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{text-align:center;font-size:10px;letter-spacing:4px;opacity:.72;margin:2px 0 9px}.panel{background:linear-gradient(180deg,#102343ee,#07111fee);border:1px solid #ffffff18;border-radius:22px;padding:14px;box-shadow:0 18px 65px #000b}.modegrid,.overs,.shots{display:grid;gap:8px}.modegrid{grid-template-columns:1fr 1fr}.overs,.shots{grid-template-columns:repeat(3,1fr)}button{border:0;color:#fff;font-weight:900}.pick,.overbtn,.btn,.small{border-radius:14px;padding:12px;background:linear-gradient(180deg,#24558c,#143457);box-shadow:0 4px 0 #071523}.pick{text-align:left}.pick small{display:block;opacity:.65;margin-top:4px}.pick.disabled{opacity:.48;filter:grayscale(.5)}.overbtn.active,.primary{background:linear-gradient(135deg,#ffd83f,#ff7600);color:#111}.primary{width:100%;border-radius:15px;padding:14px;font-size:16px;margin-top:10px;box-shadow:0 5px 0 #743100}.toggle{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px;background:#0a1b30;border-radius:12px}.toggle input{width:22px;height:22px}.sceneWrap{position:relative;border:2px solid #ffc62e99;border-radius:21px;overflow:hidden;background:#020610;box-shadow:0 20px 70px #000c}.sceneWrap canvas{display:block;width:100%!important;height:58vh!important;min-height:420px;max-height:590px}.hud{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;z-index:4;pointer-events:none}.hudCard{background:#06111ddd;border:1px solid #ffffff20;border-radius:12px;padding:7px;text-align:center;font-size:9px}.hudCard strong{display:block;font-size:17px}.banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.65);opacity:0;background:#0a1627ee;border:2px solid #ffd13b;border-radius:18px;padding:14px 22px;font-size:30px;font-weight:1000;z-index:6;transition:.18s;box-shadow:0 0 38px #ffb30066;pointer-events:none}.banner.show{opacity:.94;transform:translate(-50%,-50%) scale(1)}.flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:5;background:radial-gradient(circle,#fff9,#ffd43a33 40%,transparent 70%)}.flash.go{animation:flash .7s}@keyframes flash{0%{opacity:.75}100%{opacity:0}}.status{margin:8px 0;padding:10px;border-radius:13px;background:#0b1c31;border:1px solid #ffffff18;text-align:center;font-size:12px}.timing{height:14px;border-radius:20px;background:#081422;overflow:hidden;border:1px solid #ffffff18}.timing div{height:100%;width:0;background:linear-gradient(90deg,#ef4444,#facc15,#22c55e,#facc15,#ef4444);transition:width .08s linear}.scoreline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.mini{background:#08182b;border:1px solid #ffffff13;border-radius:12px;padding:7px 3px;text-align:center;font-size:8px}.mini b{display:block;font-size:14px}.controls{display:grid;gap:8px}.controlTitle{text-align:center;font-size:11px;letter-spacing:2px;opacity:.72}.btn.green{background:linear-gradient(180deg,#38b865,#177541)}.btn.orange{background:linear-gradient(180deg,#ff9f1d,#d65d00)}.btn.purple{background:linear-gradient(180deg,#865ee0,#4e2b93)}.btn.active{outline:2px solid #ffe86a;filter:brightness(1.15)}.row{display:flex;gap:8px;margin-top:8px}.small{flex:1;background:#1a3153}.credit{text-align:center;font-size:11px;opacity:.7;margin-top:10px}.credit b{color:#ffd13d}.note{text-align:center;font-size:10px;opacity:.5;margin-top:5px}.soundpill{position:absolute;right:10px;bottom:10px;z-index:10;border-radius:999px;padding:8px 10px;background:#071729dd;border:1px solid #ffffff22;font-size:12px}.endOverlay{position:fixed;inset:0;z-index:100;background:#02050de8;display:flex;align-items:center;justify-content:center;padding:20px}.endCard{width:min(92vw,390px);padding:24px;border-radius:24px;text-align:center;background:linear-gradient(180deg,#132b4e,#07111f);border:2px solid #ffd23f99;box-shadow:0 25px 90px #000}.endResult{font-size:34px;font-weight:1000;color:#ffd43d;margin-bottom:8px}.endCard p{opacity:.75;font-size:13px}.endActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.endActions button{border-radius:14px;padding:14px;font-size:14px}.newGame{background:linear-gradient(135deg,#ffd83f,#ff7600);color:#111}.quitGame{background:#1a3153}
</style></head><body>
<section id="menu" class="wrap panel"><div class="brand">🏏 CRICKETRUSH 3D</div><div class="sub">MATCH ENGINE v5</div><div class="modegrid"><button class="pick" onclick="selectMode('single')"><b>🤖 SINGLE PLAYER</b><small>Bat + bowl vs AI. Auto Play optional.</small></button><button class="pick disabled" onclick="showPvpInfo()"><b>🌐 ONLINE MULTIPLAYER</b><small>Not live yet — true Telegram rooms come next.</small></button></div><div style="text-align:center;margin:12px 0 7px">MATCH LENGTH</div><div class="overs" id="oversGrid"></div><div class="toggle"><span><b>⚙️ Auto Play</b><br><small style="opacity:.65">AI can play your turns.</small></span><input id="autoPlay" type="checkbox"></div><button class="primary" onclick="beginMatch()">ENTER NIGHT STADIUM</button><div class="credit">Created by <b>@RawHitz</b></div></section>
<section id="game" class="wrap hidden"><div class="brand">🏏 CRICKETRUSH 3D</div><div class="sub" id="phaseLabel">1ST INNINGS</div><div class="sceneWrap"><div id="scene"></div><div class="hud"><div class="hudCard">SCORE<strong id="scoreHud">0/0</strong></div><div class="hudCard">OVERS<strong id="oversHud">0.0</strong></div><div class="hudCard">TARGET<strong id="targetHud">—</strong></div></div><div id="banner" class="banner">FOUR!</div><div id="flash" class="flash"></div><button id="soundPill" class="soundpill" onclick="toggleSound()">🔊 SOUND</button></div><div id="status" class="status">Match loading...</div><div class="timing"><div id="timingBar"></div></div><div class="scoreline"><div class="mini">RUNS<b id="runs">0</b></div><div class="mini">WICKETS<b id="wkts">0</b></div><div class="mini">BALL<b id="ballNo">0/18</b></div><div class="mini">RR<b id="rr">0.00</b></div></div><div id="batControls" class="controls hidden"></div><div id="bowlControls" class="controls hidden"></div><div class="row"><button id="autoBtn" class="small" onclick="toggleAuto()">AUTO: OFF</button><button class="small" onclick="quitMatch()">QUIT MATCH</button></div><div class="credit">Created by <b>@RawHitz</b></div></section>
<div id="matchEnd" class="endOverlay hidden"><div class="endCard"><div id="endResult" class="endResult">YOU WIN!</div><p>Match complete. Choose what you want to do next.</p><div class="endActions"><button class="newGame" onclick="newGame()">🏏 NEW GAME</button><button class="quitGame" onclick="quitToHome()">✕ QUIT</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const oversList=[3,5,10,12,15,20];let selectedOvers=3;const grid=document.getElementById('oversGrid');oversList.forEach(n=>{const b=document.createElement('button');b.className='overbtn'+(n===3?' active':'');b.textContent=n+' OVERS';b.onclick=()=>{selectedOvers=n;[...grid.children].forEach(x=>x.classList.remove('active'));b.classList.add('active')};grid.appendChild(b)});function selectMode(){}function showPvpInfo(){alert('True online multiplayer is not live yet.')}
let innings=1,battingSide='player',runs=0,wkts=0,balls=0,target=null,firstInnings=0,auto=false,busy=false,matchOver=false;function unlockAudio(){}function sfx(){}function init3D(){}function resetActors(){}function setStatus(s){status.textContent=s}function updateUI(){scoreHud.textContent=`${runs}/${wkts}`;oversHud.textContent=`${Math.floor(balls/6)}.${balls%6}`;targetHud.textContent=target||'—';document.getElementById('runs').textContent=runs;document.getElementById('wkts').textContent=wkts;ballNo.textContent=`${balls}/${selectedOvers*6}`;rr.textContent=balls?(runs/(balls/6)).toFixed(2):'0.00';phaseLabel.textContent=innings===1?'1ST INNINGS':`CHASE • TARGET ${target}`;autoBtn.textContent='AUTO: '+(auto?'ON':'OFF')}
function toggleAuto(){auto=!auto;updateUI()}function quitMatch(){quitToHome()}function newGame(){matchEnd.classList.add('hidden');game.classList.add('hidden');menu.classList.remove('hidden');matchOver=false;busy=false;auto=false;document.getElementById('autoPlay').checked=false;window.scrollTo(0,0)}function quitToHome(){matchEnd.classList.add('hidden');game.classList.add('hidden');menu.classList.remove('hidden');matchOver=false;busy=false;auto=false;window.scrollTo(0,0)}function beginMatch(){auto=document.getElementById('autoPlay').checked;innings=1;battingSide=Math.random()<.5?'player':'ai';runs=wkts=balls=0;target=null;firstInnings=0;matchOver=false;menu.classList.add('hidden');game.classList.remove('hidden');matchEnd.classList.add('hidden');setStatus(battingSide==='player'?'You bat first.':'You bowl first.');updateUI()}
function finishMatch(msg){matchOver=true;busy=true;setStatus(msg+' Match complete.');updateUI();setTimeout(()=>{endResult.textContent=msg;matchEnd.classList.remove('hidden')},900)}
</script></body></html>
