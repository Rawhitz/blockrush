<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#1296ff"><title>Balls Rush</title><link rel="stylesheet" href="style.css?v=2"><script src="https://telegram.org/js/games.js"></script></head><body><div id="app"><canvas id="game"></canvas><div id="hud" class="hidden"><div class="hud-left"><div class="lives" id="lives">❤️❤️❤️❤️❤️</div><div class="score" id="score">000000</div></div><div class="logo-mini">BALLS<br><b>RUSH</b></div><div class="hud-right"><div>🪙 <b id="coins">0</b></div><div>💎 <b id="gems">0</b></div><button id="pauseBtn">Ⅱ</button></div><div class="levelbar"><span id="levelNow">1</span><div><i id="levelFill"></i></div><span id="levelNext">2</span></div><div id="gestureHint" class="gesture-hint">TOP = JUMP · HOLD LEFT / RIGHT = SPEED</div></div><div id="home" class="screen"><div class="home-card"><div class="ball-hero">🙂</div><h1><span>BALLS</span> RUSH</h1><p>BOUNCE · DODGE · COLLECT · ESCAPE</p><div class="stats"><span>🏆 Best <b id="bestScore">0</b></span><span>⭐ Level <b id="bestLevel">1</b></span></div><button id="playBtn" class="primary">▶ PLAY</button><button id="levelsBtn" class="secondary">🗺️ LEVELS</button><div class="dev">Developed by <b>@RawHitz</b></div></div></div><div id="levels" class="screen hidden"><div class="panel"><h2>Select Level</h2><div id="levelGrid" class="level-grid"></div><button id="levelsBack" class="secondary">BACK</button></div></div><div id="pause" class="screen hidden"><div class="panel"><h2>Paused</h2><button id="resumeBtn" class="primary">RESUME</button><button id="restartBtn" class="secondary">RESTART LEVEL</button><button id="quitBtn" class="secondary">HOME</button></div></div><div id="result" class="screen hidden"><div class="panel"><h2 id="resultTitle">LEVEL COMPLETE!</h2><div class="results"><div>⭐<b id="resultScore">0</b><small>Total Score</small></div><div>🪙<b id="resultCoins">0</b><small>Total Coins</small></div><div>💎<b id="resultGems">0</b><small>Total Gems</small></div></div><button id="nextBtn" class="primary">NEXT LEVEL</button><button id="againBtn" class="secondary">REPLAY LEVEL</button><button id="resultHomeBtn" class="secondary">HOME</button></div></div></div><script src="game.js?v=2"></script></body></html>
